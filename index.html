<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Carga y Programación de Horarios de ETS - ESCA Santo Tomás</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ipn: {
                            guinda: '#6B1D2F',
                            guindadark: '#4E111E',
                            dorado: '#C5A059',
                            doradolight: '#F3E5AB'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Modal / Pantalla de Inicio de Sesión -->
    <div id="login-overlay" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-200">
            <div class="bg-gradient-to-r from-ipn-guindadark to-ipn-guinda p-6 text-white text-center relative">
                <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg text-ipn-guinda text-2xl font-black overflow-hidden border-2 border-ipn-dorado">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h2 class="text-lg font-black uppercase tracking-wide">Acceso al Sistema ETS</h2>
                <p class="text-xs text-rose-100 mt-1">ESCA Santo Tomás - Instituto Politécnico Nacional</p>
            </div>
            <div class="p-6 flex flex-col gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1"><i class="fa-solid fa-user text-ipn-guinda mr-1"></i> Usuario:</label>
                    <input type="text" id="login-user" placeholder="Ingrese su usuario..." class="w-full text-xs border border-slate-300 rounded-lg p-2.5 font-medium focus:outline-none focus:ring-2 focus:ring-ipn-guinda bg-slate-50">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1"><i class="fa-solid fa-key text-ipn-guinda mr-1"></i> Contraseña:</label>
                    <input type="password" id="login-pass" placeholder="••••••••" class="w-full text-xs border border-slate-300 rounded-lg p-2.5 font-medium focus:outline-none focus:ring-2 focus:ring-ipn-guinda bg-slate-50" onkeypress="if(event.key === 'Enter') doLogin()">
                </div>
                <div id="login-error" class="hidden text-xs text-rose-700 bg-rose-50 border border-rose-200 p-2 rounded-lg font-semibold text-center">
                    Usuario o contraseña incorrectos.
                </div>
                <button onclick="doLogin()" class="w-full bg-ipn-guinda hover:bg-ipn-guindadark text-white font-bold py-2.5 rounded-lg shadow-md transition text-xs uppercase tracking-wider flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Iniciar Sesión</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Header Institucional -->
    <header class="bg-gradient-to-r from-ipn-guindadark via-ipn-guinda to-[#801830] text-white shadow-lg sticky top-0 z-40 border-b-4 border-ipn-dorado">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-white p-1 rounded-lg shadow-md flex items-center justify-center w-12 h-12 overflow-hidden border border-ipn-dorado">
                    <i class="fa-solid fa-graduation-cap text-ipn-guinda text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wide leading-none flex items-center gap-2">
                        GESTIÓN ESCOLAR <span class="bg-ipn-dorado text-slate-900 text-xs px-2 py-0.5 rounded font-extrabold uppercase">ETS SAES</span>
                    </h1>
                    <p class="text-xs text-rose-100 font-medium">ESCA Santo Tomás - IPN | <span id="current-user-badge" class="font-bold text-yellow-300"></span></p>
                </div>
            </div>
            <div class="flex items-center flex-wrap gap-2">
                <button onclick="logout()" class="bg-rose-900/80 hover:bg-rose-900 text-white text-xs font-semibold px-3 py-2 rounded shadow transition">Salir</button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 flex flex-col gap-4">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
            <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wide">Panel Principal ETS</h2>
        </div>
    </main>

    <script>
        function doLogin() {
            document.getElementById('login-overlay').style.display = 'none';
        }
        function logout() {
            document.getElementById('login-overlay').style.display = 'flex';
        }
    </script>
</body>
</html>
